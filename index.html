<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WHERE IS MY DRAWING?</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <main class="workspace">
            <header class="topbar">
                <div class="top-title"><a href="index.html">WHERE IS MY DRAWING?</a><small>THE MISSING DRAWING ARCHIVE</small></div>
                <div class="top-actions"><button class="text-link" data-action="journal">SEARCH LOG ▤</button></div>
            </header>
            <div class="roomviewport" id="viewport">
                <div class="scene" id="scene"><img id="roomImage" draggable="false" alt=""></div>
            </div>
            <span class="preview-pill" id="previewPill">LOW-RES ROOM PREVIEW</span>
            <div class="room-note">
                <span class="eyebrow" id="roomEnglish"></span><strong id="roomName"></strong>
                <p id="roomSubtitle"></p>
                <!-- <div class="counter">이 방의 발견 <strong id="roomCount">00</strong> / <span id="roomTotal">00</span> · 전체
                    <strong id="foundCount">00</strong> / <span id="totalCount">00</span>
                </div> -->
            </div>
            <nav class="bottom-actions" aria-label="하단 메뉴"><button data-action="rooms">ROOMS</button><button
                    data-action="archive">DRAWING</button><button data-action="journal">JOURNAL</button></nav>
            <aside class="side-drawer" id="sideDrawer" aria-label="탐색 패널" aria-hidden="true">
                <div class="side-drawer-head">
                    <div><strong id="sideDrawerTitle">Search Journal</strong><small id="sideDrawerSubtitle">SEARCH
                            JOURNAL</small></div><button class="side-drawer-close" id="closeSideDrawer"
                        aria-label="패널 닫기">×</button>
                </div>
                <div class="side-drawer-content scrollbar" id="sideDrawerContent"></div>
            </aside>
            <div class="zoomtools"><button id="zoomIn" aria-label="확대">+</button><button id="zoomOut"
                    aria-label="축소">−</button><button id="zoomReset" aria-label="전체 보기">⌗</button></div>
        </main>
        <footer class="footer"><span>THE MISSING DRAWING ARCHIVE © 2026</span><span>DESIGN BY STELLA</span></footer>
    </div>
    <div class="overlay" id="overlay" hidden>
        <div class="dialog scrollbar" role="dialog" aria-modal="true" aria-label="상세 정보"><button id="closeOverlay"
                class="close-overlay" aria-label="팝업 닫기">×</button>
            <div id="overlayContent"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>



</html>
